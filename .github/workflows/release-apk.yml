name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach APK to (e.g. v0.5.57)"
        required: true
        default: "v0.5.58"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare saylat.apk
        run: cp android/app/build/outputs/apk/release/app-release.apk saylat.apk

      - name: Release notes from update.json
        id: meta
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("releases/update.json").read_text(encoding="utf-8"))
          name = data.get("version_name", "Saylat")
          notes = data.get("release_notes", f"Saylat {name}")
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_name={name}\n")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: saylat.apk
          name: Saylat ${{ steps.meta.outputs.version_name }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update.json on main branch after release
        run: |
          git fetch origin main
          git checkout main
          git config user.email "saylat@baddysays.ru"
          git config user.name "baddysays"
          python3 <<'PY'
          import json
          from pathlib import Path
          tag = "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          data = json.loads(Path("releases/update.json").read_text(encoding="utf-8"))
          data["apk_url"] = f"https://github.com/Baddysays/Saylat/releases/download/{tag}/saylat.apk"
          Path("releases/update.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git add releases/update.json
          git diff --cached --quiet || git commit -m "release: update apk_url for ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          git push origin main
