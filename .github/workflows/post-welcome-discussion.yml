# Creates or updates welcome post in Discussions.
name: Post welcome discussion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-welcome-discussion.yml
      - docs/github/DISCUSSIONS-WELCOME.md

permissions:
  contents: read
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update welcome discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TITLE='ƒобро пожаловать в Saylat Ч с чего начать'
          REPO_ID='R_kgDOSnrE7Q'

          BODY="$(python3 -c "
          import re
          t=open('docs/github/DISCUSSIONS-WELCOME.md',encoding='utf-8').read()
          t=re.sub(r'<!--.*?-->\\s*','',t,flags=re.S)
          print(t.strip())
          ")"

          existing_json="$(gh api graphql -f query='
            query {
              repository(owner: "Baddysays", name: "Saylat") {
                discussions(first: 30, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes { id title url }
                }
              }
            }')"

          existing_id="$(echo "$existing_json" | jq -r --arg t "$TITLE" '.data.repository.discussions.nodes[] | select(.title==$t) | .id' | head -n1)"
          existing_url="$(echo "$existing_json" | jq -r --arg t "$TITLE" '.data.repository.discussions.nodes[] | select(.title==$t) | .url' | head -n1)"

          if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
            gh api graphql \
              -f query='mutation($id: ID!, $title: String!, $body: String!) {
                updateDiscussion(input: {discussionId: $id, title: $title, body: $body}) {
                  discussion { id url }
                }
              }' \
              -f id="$existing_id" \
              -f title="$TITLE" \
              -f body="$BODY"
            disc_id="$existing_id"
            url="$existing_url"
            echo "Updated: $url"
          else
            CAT_ID="$(gh api graphql -f query='
              query {
                repository(owner: "Baddysays", name: "Saylat") {
                  discussionCategories(first: 20) { nodes { id slug } }
                }
              }' --jq '.data.repository.discussionCategories.nodes[] | select(.slug=="general") | .id' | head -n1)"

            if [ -z "$CAT_ID" ]; then
              echo "Could not resolve General category id"
              exit 1
            fi

            result="$(gh api graphql \
              -f query='mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
                createDiscussion(input: {repositoryId: $repo, categoryId: $cat, title: $title, body: $body}) {
                  discussion { url id }
                }
              }' \
              -f repo="$REPO_ID" \
              -f cat="$CAT_ID" \
              -f title="$TITLE" \
              -f body="$BODY")"

            url="$(echo "$result" | jq -r '.data.createDiscussion.discussion.url')"
            disc_id="$(echo "$result" | jq -r '.data.createDiscussion.discussion.id')"
            echo "Created: $url"
          fi

          gh api graphql \
            -f query='mutation($id: ID!) { pinDiscussion(input: {discussionId: $id}) { clientMutationId } }' \
            -f id="$disc_id" \
            && echo "Pinned." \
            || echo "Pin skipped Ч open $url and Pin discussion manually."
