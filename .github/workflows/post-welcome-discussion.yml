# Creates welcome post in Discussions (idempotent).
name: Post welcome discussion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-welcome-discussion.yml
      - docs/github/DISCUSSIONS-WELCOME.md

permissions:
  contents: read
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create welcome discussion if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TITLE='Добро пожаловать в Saylat — с чего начать'
          REPO_ID='R_kgDOSnrE7Q'

          existing="$(gh api graphql -f query='
            query {
              repository(owner: "Baddysays", name: "Saylat") {
                discussions(first: 30, orderBy: {field: CREATED_AT, direction: DESC}) {
                  nodes { title }
                }
              }
            }' --jq '.data.repository.discussions.nodes[].title' 2>/dev/null || true)"

          if echo "$existing" | grep -Fxq "$TITLE"; then
            echo "Welcome discussion already exists."
            exit 0
          fi

          BODY="$(python3 -c "
          import re
          t=open('docs/github/DISCUSSIONS-WELCOME.md',encoding='utf-8').read()
          t=re.sub(r'<!--.*?-->\\s*','',t,flags=re.S)
          print(t.strip())
          ")"

          CAT_ID="$(gh api graphql -f query='
            query {
              repository(owner: "Baddysays", name: "Saylat") {
                discussionCategories(first: 20) {
                  nodes { id slug }
                }
              }
            }' --jq '.data.repository.discussionCategories.nodes[] | select(.slug=="general") | .id' | head -n1)"

          if [ -z "$CAT_ID" ]; then
            echo "Could not resolve General category id:"
            gh api graphql -f query='
              query {
                repository(owner: "Baddysays", name: "Saylat") {
                  discussionCategories(first: 20) { nodes { id slug name } }
                }
              }'
            exit 1
          fi

          result="$(gh api graphql \
            -f query='mutation($repo: ID!, $cat: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repo, categoryId: $cat, title: $title, body: $body}) {
                discussion { url id }
              }
            }' \
            -f repo="$REPO_ID" \
            -f cat="$CAT_ID" \
            -f title="$TITLE" \
            -f body="$BODY")"

          echo "$result"
          url="$(echo "$result" | jq -r '.data.createDiscussion.discussion.url')"
          disc_id="$(echo "$result" | jq -r '.data.createDiscussion.discussion.id')"
          echo "Created: $url"

          gh api graphql \
            -f query='mutation($id: ID!) { pinDiscussion(input: {discussionId: $id}) { clientMutationId } }' \
            -f id="$disc_id" \
            && echo "Pinned." \
            || echo "Pin skipped — open $url and Pin discussion manually."
