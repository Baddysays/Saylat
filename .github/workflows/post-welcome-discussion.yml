# Creates welcome post in Discussions (idempotent).
name: Post welcome discussion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-welcome-discussion.yml
      - scripts/ci-post-welcome-discussion.sh
      - docs/github/DISCUSSIONS-WELCOME.md

permissions:
  contents: read
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create welcome discussion if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-post-welcome-discussion.sh
