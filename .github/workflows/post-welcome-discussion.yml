# Creates welcome discussion #1 when missing; warns if body is stale (no PAT).
# GITHUB_TOKEN: createDiscussion OK, updateDiscussion FORBIDDEN.
# Optional secret DISCUSSION_PAT (classic PAT, repo scope) enables auto-update.
name: Post welcome discussion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-welcome-discussion.yml
      - docs/github/DISCUSSIONS-WELCOME.md
      - scripts/ci-sync-welcome-discussion.py

permissions:
  contents: read
  discussions: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync welcome discussion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCUSSION_PAT: ${{ secrets.DISCUSSION_PAT }}
        run: python3 scripts/ci-sync-welcome-discussion.py
