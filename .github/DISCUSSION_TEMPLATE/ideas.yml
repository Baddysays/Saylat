title: "💡 Идея"
labels:
  - idea
category: "Ideas"
body:
  - type: markdown
    value: |
      Предложения по функциям, интерфейсу и «режиму 2G». После обсуждения удобные идеи переносим в [Issues](https://github.com/Baddysays/Saylat/issues/new?template=feature_request.md).
  - type: textarea
    id: idea
    attributes:
      label: Идея
      description: Какую проблему решает и для кого
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы (необязательно)
      description: Как сейчас обходитесь без этой функции
