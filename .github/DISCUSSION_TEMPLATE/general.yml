title: "💬 Общий вопрос"
labels:
  - question
category: "General"
body:
  - type: markdown
    value: |
      Вопросы по Saylat: APK, личный сервер, сеть. **Не публикуйте** пароли, API-ключи и полные токены.
  - type: input
    id: version
    attributes:
      label: Версия Saylat
      placeholder: "0.5.35"
  - type: dropdown
    id: network
    attributes:
      label: Сеть
      options:
        - Wi‑Fi
        - LTE / 4G
        - 3G / медленная
        - Не знаю
  - type: textarea
    id: body
    attributes:
      label: Вопрос
      description: Что делали, что ожидали, что получилось
    validations:
      required: true
