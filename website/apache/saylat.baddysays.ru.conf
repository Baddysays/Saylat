<VirtualHost *:80>
    ServerAdmin hello@baddysays.ru
    DocumentRoot "/www/wwwroot/saylat.baddysays.ru"
    ServerName saylat.baddysays.ru
    ErrorLog "/www/wwwlogs/saylat.baddysays.ru-error_log"
    CustomLog "/www/wwwlogs/saylat.baddysays.ru-access_log" combined

    <Directory "/www/wwwroot/saylat.baddysays.ru">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin hello@baddysays.ru
    DocumentRoot "/www/wwwroot/saylat.baddysays.ru"
    ServerName saylat.baddysays.ru
    ErrorLog "/www/wwwlogs/saylat.baddysays.ru-error_log"
    CustomLog "/www/wwwlogs/saylat.baddysays.ru-access_log" combined

    SSLEngine On
    SSLCertificateFile /www/server/panel/vhost/cert/saylat.baddysays.ru/fullchain.pem
    SSLCertificateKeyFile /www/server/panel/vhost/cert/saylat.baddysays.ru/privkey.pem
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On

    <Directory "/www/wwwroot/saylat.baddysays.ru">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
</VirtualHost>
