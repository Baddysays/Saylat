<VirtualHost *:80>
    ServerAdmin hello@baddysays.ru
    DocumentRoot "/www/wwwroot/saylat.baddysays.ru"
    ServerName saylat.baddysays.ru
    ErrorLog "/www/wwwlogs/saylat.baddysays.ru-error_log"
    CustomLog "/www/wwwlogs/saylat.baddysays.ru-access_log" combined

    <Directory "/www/wwwroot/saylat.baddysays.ru">
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    Alias /.well-known /www/wwwroot/saylat.baddysays.ru/.well-known
</VirtualHost>
